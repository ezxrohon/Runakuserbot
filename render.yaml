services:
  - type: web
    name: runak-userbot
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      # ── secrets: paste them in the Render dashboard (never commit them) ──
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: TELEGRAM_SESSIONS    # one session string per account, comma-separated (or use TELEGRAM_SESSION for one)
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID             # optional: your Telegram user id, if you'll open the panel from an account not listed above
        sync: false
      - key: GROQ_API_KEY        # optional, only for the AI plugin
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON  # optional: paste the Firebase service-account JSON, one line
        sync: false
      # ── settings ──
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: PREFIX
        value: "."
      - key: TIMEZONE
        value: UTC               # e.g. Asia/Kolkata
      - key: KEEPALIVE
        value: "1"               # 0 = don't self-ping (the service may then sleep)
